<mat-card class="tracker-card">
  <mat-card-header>
    <mat-card-title>Simple Child Lifecycle</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p><strong>Current &#64;Input counter:</strong> {{ counter }}</p>
    <p>This simple example focuses on 3 hooks only:</p>
    <ul class="hook-list">
      <li><strong>ngOnInit</strong> → runs once when child is created</li>
      <li><strong>ngOnChanges</strong> → runs when &#64;Input value changes</li>
      <li><strong>ngOnDestroy</strong> → runs when child is removed</li>
    </ul>

    <div class="logs" *ngIf="events.length">
      <p><strong>Hook event log:</strong></p>
      <ul>
        <li *ngFor="let event of events">{{ event }}</li>
      </ul>
    </div>
  </mat-card-content>
</mat-card>
