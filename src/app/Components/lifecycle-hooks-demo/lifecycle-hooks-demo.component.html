<div class="hooks-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Angular Lifecycle Hooks Demo</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="action-row">
        <button mat-raised-button color="primary" (click)="incrementCounter()">
          Change &#64;Input (counter = {{ counter }})
        </button>

        <button mat-raised-button color="accent" (click)="toggleChild()">
          {{ showChild ? 'Destroy Child (ngOnDestroy)' : 'Create Child Again' }}
        </button>
      </div>

      <app-lifecycle-tracker *ngIf="showChild" [counter]="counter">
        <p>Projected content from parent to child for content hooks.</p>
      </app-lifecycle-tracker>

      <p *ngIf="!showChild" class="destroy-note">Child component destroyed. Open browser console to see ngOnDestroy log.</p>
    </mat-card-content>
  </mat-card>
</div>
